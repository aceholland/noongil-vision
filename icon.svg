<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Round warm cream background matching app theme -->
  <circle cx="256" cy="256" r="256" fill="#f7efe4" />
  
  <!-- Solid Orange 'N' centered with exact equal distance from top, bottom, left & right -->
  <g fill="#e2634b">
    <!-- Left vertical stem -->
    <rect x="112" y="112" width="64" height="288" />
    <!-- Right vertical stem -->
    <rect x="336" y="112" width="64" height="288" />
    <!-- Center diagonal stroke -->
    <polygon points="112,112 176,112 400,400 336,400" />
  </g>
</svg>
